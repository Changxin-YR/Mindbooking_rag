[project]
name = "novel-platform-backend"
version = "0.1.0"
description = "V1.2 modular monolith backend foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
strict = true
mypy_path = "src"
