name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-config:
    name: Foundation configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f infra/docker-compose.yml --env-file .env.example config --quiet

      - name: Validate app profile
        run: docker compose -f infra/docker-compose.yml --env-file .env.example --profile apps config --quiet

      - name: Run foundation self-check
        shell: pwsh
        run: ./scripts/validate-foundation.ps1

  backend:
    name: Backend tests and quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/backend
          python -m pip install --group services/backend/pyproject.toml:dev
      - name: Backend quality
        working-directory: services/backend
        run: |
          python -m pytest -q
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -m mypy src
          alembic upgrade head --sql > migration.sql

  frontend:
    name: Frontend tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend quality
        run: |
          pnpm -r test
          pnpm -r typecheck
          pnpm -r build
