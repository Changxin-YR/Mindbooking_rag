name: ${COMPOSE_PROJECT_NAME:-novel-platform}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel_platform}
      MYSQL_USER: ${MYSQL_USER:-novel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-novel_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-novel_root_dev_only}
    ports:
      - "${MYSQL_PORT:-127.0.0.1:13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-novel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-novel_dev_only}
    ports:
      - "${RABBITMQ_PORT:-127.0.0.1:5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-127.0.0.1:15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${OPENSEARCH_PORT:-127.0.0.1:9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-novel_platform}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-novel}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_dev_only}
    ports:
      - "${CLICKHOUSE_PORT:-127.0.0.1:8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-127.0.0.1:19000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query \"SELECT 1\" >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_dev_only}
    ports:
      - "${S3_PORT:-127.0.0.1:9000}:9000"
      - "${MINIO_CONSOLE_PORT:-127.0.0.1:9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    profiles: [apps]
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-novel}:${MYSQL_PASSWORD:-novel_dev_only}@mysql:3306/${MYSQL_DATABASE:-novel_platform}
      PERSISTENCE_MODE: sql
      OPENSEARCH_URL: http://opensearch:9200
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-session-secret}
      REAL_NAME_ENCRYPTION_KEY: ${REAL_NAME_ENCRYPTION_KEY:-development-only-real-name-encryption-key}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-development-only-payment-callback-secret}
      PAYMENT_CALLBACK_MAX_SKEW_SECONDS: ${PAYMENT_CALLBACK_MAX_SKEW_SECONDS:-300}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-SANDBOX_ALIPAY}
      PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-SANDBOX_BANK}
      # Development/staging-only bootstrap. Production must provide its own secret values.
      STAFF_BOOTSTRAP_EMPLOYEE_CODE: ${STAFF_BOOTSTRAP_EMPLOYEE_CODE:-qa-admin}
      STAFF_BOOTSTRAP_PASSWORD: ${STAFF_BOOTSTRAP_PASSWORD:-QaAdmin#123456}
      AGENT_BACKEND_URL: ${AGENT_BACKEND_URL:-http://backend:80}
      DEEPSEEK_HARNESS_RUNTIME_MODE: ${DEEPSEEK_HARNESS_RUNTIME_MODE:-web}
      DEEPSEEK_HARNESS_WEB_BRIDGE_URL: ${DEEPSEEK_HARNESS_WEB_BRIDGE_URL:-http://harness:8090}
      DEEPSEEK_HARNESS_WEB_BRIDGE_SECRET: ${DEEPSEEK_HARNESS_WEB_BRIDGE_SECRET:-development-only-harness-bridge-secret}
      DEEPSEEK_HARNESS_WEB_START_TIMEOUT_SECONDS: ${DEEPSEEK_HARNESS_WEB_START_TIMEOUT_SECONDS:-120}
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "${API_PORT:-127.0.0.1:8000}:80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  reader:
    build:
      context: ..
      dockerfile: infra/docker/reader.Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-/}
    profiles: [apps]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  writer:
    build:
      context: ..
      dockerfile: infra/docker/writer.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_APP_BASE: ${VITE_APP_BASE:-/writer/}
    profiles: [apps]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  admin:
    build:
      context: ..
      dockerfile: infra/docker/admin.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_APP_BASE: ${VITE_ADMIN_APP_BASE:-/admin/}
    profiles: [apps]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  harness:
    image: node:24-bookworm-slim
    profiles: [apps]
    working_dir: /harness
    volumes:
      - ${DEEPSEEK_HARNESS_REPO:-../../deepseek-harness-master}:/harness
      - harness_node_modules:/harness/node_modules
      - ../scripts/harness_web_host.mjs:/bridge/harness_web_host.mjs:ro
      - harness_web_data:/harness-data
    environment:
      HARNESS_REPO: /harness
      HARNESS_HOME_ROOT: /harness-data
      HARNESS_BRIDGE_PORT: 8090
      HARNESS_BRIDGE_SECRET: ${DEEPSEEK_HARNESS_WEB_BRIDGE_SECRET:-development-only-harness-bridge-secret}
      HARNESS_BACKEND_URL: ${HARNESS_BACKEND_URL:-http://backend:80}
      HARNESS_IDLE_TIMEOUT_SECONDS: ${HARNESS_IDLE_TIMEOUT_SECONDS:-300}
      HARNESS_PORT_START: ${HARNESS_PORT_START:-3081}
      HARNESS_PORT_END: ${HARNESS_PORT_END:-3180}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_PROVIDER: ${DEEPSEEK_PROVIDER:-deepseek-official}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DSH_CLIENT_COMMIT_HASH: ${DEEPSEEK_HARNESS_COMMIT_HASH:-0000000}
    command: >-
      sh -lc "apt-get update && apt-get install -y --no-install-recommends git ca-certificates && corepack enable && if [ ! -f apps/web/dist/index.html ]; then pnpm install --frozen-lockfile && pnpm run build; fi && node /bridge/harness_web_host.mjs"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HARNESS_WEB_PORT_RANGE:-127.0.0.1:3081-3180}:3081-3180"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  nginx:
    image: nginx:1.27-alpine
    profiles: [apps]
    depends_on:
      backend:
        condition: service_healthy
      reader:
        condition: service_healthy
      writer:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-127.0.0.1:8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  opensearch_data:
  clickhouse_data:
  minio_data:
  harness_node_modules:
  harness_web_data:
